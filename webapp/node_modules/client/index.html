<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ExamHub</title>
    <!-- Resolve the theme before first paint so there is no light-mode flash.
         Must run before the module script. Always writes a resolved light|dark,
         because the `dark:` variant keys off this attribute existing. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("examhub.theme") || "system";
          var d = s === "dark" || (s === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = d ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
